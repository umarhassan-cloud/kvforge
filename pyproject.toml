[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pulsecache"
version = "0.1.0"
description = "PulseCache — paged KV-cache LLM inference engine with continuous batching, speculative decoding, and INT8/INT4 quantization."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["llm", "inference", "pagedattention", "speculative-decoding", "quantization", "serving"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.5"]
hf = ["transformers>=4.40", "safetensors>=0.4"]
dev = ["pytest>=7.4", "ruff>=0.4", "httpx>=0.27", "fastapi>=0.110", "pydantic>=2.5"]

[project.urls]
Homepage = "https://github.com/umarhassan-cloud/pulsecache"
Documentation = "https://github.com/umarhassan-cloud/pulsecache/blob/main/DESIGN.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pulsecache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "benchmarks", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E741",   # ambiguous variable names (l, I) are idiomatic in math-heavy code
    "B023",   # hook closures bind loop vars through default args deliberately
    "RUF001",
    "RUF002",
    "RUF003", # unicode arrows / Greek letters in docstrings are intentional
    "SIM108",
    "B905",   # zip(strict=) - lengths are invariants checked elsewhere
    "RUF005",
]

[tool.ruff.lint.isort]
known-first-party = ["pulsecache"]
